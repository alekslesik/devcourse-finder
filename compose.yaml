name: devcourse-finder

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devcourse}
      POSTGRES_USER: ${POSTGRES_USER:-devcourse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcourse-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["migrate"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-devcourse}
      PGUSER: ${POSTGRES_USER:-devcourse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devcourse-local}
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-devcourse}
      PGUSER: ${POSTGRES_USER:-devcourse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devcourse-local}
      PGSSLMODE: disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
