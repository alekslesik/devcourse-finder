<!doctype html><html lang="ru"><head><link rel="canonical" href="https://ru.hexlet.io/programs/frontend"><meta name="description" content="10 месяцев: HTML, CSS, JS, TypeScript, React. RSS-агрегатор и Slack-чат — реальные проекты. Код-ревью от наставников. Начните бесплатно." /><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Программирование — темный лес для меня. Справлюсь?","acceptedAnswer":{"@type":"Answer","text":"Не будем лукавить, изучать новые технологии трудно даже для тех, у кого позади не один год опыта работы. Чтобы достичь цели, нужно не только желание, но и упорство. Честно ответьте себе, готовы ли вы прикладывать максимум усилий и не отступать, если будет сложно? Если да, результат обязательно будет!\nМы точно знаем, что наши курсы подходят для новичков, junior и middle-специалистов, а отзывы и примеры наших выпускников показывают, что можно с нуля освоить профессию программиста, найти работу и стать ценным специалистом. И, конечно, наши преподаватели вам в этом помогут.\nТак что попробовать стоит! А если сомневаетесь, просто оставьте заявку на обучение и пройдите бесплатные курсы профессии — сможете проверить и свой интерес к программированию, тестированию или аналитике, а заодно проверить качество наших материалов."}},{"@type":"Question","name":"Получится ли совмещать обучение в онлайн-школе Хекслет, если я работаю по другой профессии?","acceptedAnswer":{"@type":"Answer","text":"Судя по отзывам о курсах, многие наши студенты так и делают: учатся и работают одновременно. Мы понимаем, не у всех есть возможность посвящать всё время обучению. Поэтому сделали формат асинхронным. Доступ к образовательной платформе открыт 24/7, вы проходите уроки, когда удобно вам, учитесь в своем темпе и не ждете других студентов группы.\nМы рекомендуем уделять учебе 15-20 часов в неделю. Тогда получится закончить обучение на курсе в срок.\nКонечно, это приблизительная оценка. Если у студента уже есть знания и тем более опыт работы, получится справляться с задачами быстрее, а у новичков уровня junior может уходить больше времени."}},{"@type":"Question","name":"А если мне нужен будет перерыв в обучении?","acceptedAnswer":{"@type":"Answer","text":"Если жизненные обстоятельства складываются так, что учиться на курсе не получается, вы можете взять академический отпуск. Просто предупредите об этом вашего куратора и преподавателя.\nКонечно, на год забросить обучение не получится, но 1 месяц отдыха от курса вы себе сможете позволить. Распределяйте это время, как вам удобно: берите целиком или разбивайте по неделям. Ваше обучение на курсе Хекслета просто увеличится на количество пропущенных дней. Доплачивать за них вам не придется."}},{"@type":"Question","name":"Мой возраст далек от студенческого, не поздно ли учиться на фронтенд-разработчика?","acceptedAnswer":{"@type":"Answer","text":"Самому юному студенту, который учился в Хекслете, было 15, а самому взрослому — 70 лет. Есть желание и интерес? Начинайте независимо от возраста и от того, как отзываются об этой затее близкие.\nЕсли ваша цель — трудоустройство, мы честно говорим, что студентам старшего возраста без опыта работы в IT может потребоваться больше времени, чтобы найти подходящее место. Но у нас много отзывов и примеров, когда выпускники Хекслета успешно трудоустраивались, например, после 50 лет. Вот одна из таких историй."}},{"@type":"Question","name":"Что делать после того, как я оставлю заявку на курс?","acceptedAnswer":{"@type":"Answer","text":"Начать проходить бесплатные курсы по доступным технологиям. В них есть теория, тесты и практика, но нет помощи преподавателя. В программе они будут обозначены кружком — открывайте и пробуйте!\nДождаться звонка от специалиста по обучению. Мы позвоним в этот же день или на следующий, если заявка придет вечером.\nНе волнуйтесь, мы не будем навязывать обучение. Да и заявка не обязывает вас к покупке. Для нас это возможность уточнить ваши намерения, помочь с выбором, ответить на вопросы. Случается, что после такой беседы люди делают выбор в пользу другой технологии или вовсе понимают, что данный курс им не нужен. Любое решение будет правильным, если оно взвешенное и осознанное."}},{"@type":"Question","name":"Кто такой наставник и как он помогает в учебе?","acceptedAnswer":{"@type":"Answer","text":"Наставники — это программисты, настоящие эксперты, которые за несколько лет в профессии добились выдающихся результатов, а теперь делятся знаниями и опытом с учащимися Хекслета. Кандидаты проходят строгий отбор — преподавателем становится лишь каждый десятый из откликнувшихся на вакансию, поэтому случайных людей у нас нет. Большинство экспертов имеют уровень senior-специалистов.\nНаставник отвечает на вопросы по курсам школы, модулям и проектам и в целом по выбранной профессии, а если возникнут трудности, поможет с ними разобраться.\nСтуденты общаются с наставником в закрытом чате, а также на регулярных групповых созвонах, вебинарах и сессиях лайв-кодинга."}},{"@type":"Question","name":"Что такое коммерческие проекты и зачем в них участвовать?","acceptedAnswer":{"@type":"Answer","text":"Коммерческие проекты — это собственные проекты Хекслета. Каждый студент может поработать над ними, предложить улучшения, находя и исправляя ошибки, выполнить задачу.\nЭто полезная практика различных технологий, которую можно указать при отклике на вакансии. Во-первых, она учит разбираться в чужом коде. Да, разработчикам чаще приходится работать с чужим кодом, нежели верстать веб-страницы и писать свое. Во-вторых, помогать другим — здорово.\nХекслет поддерживает более 10 проектов — будет на чем потренироваться и попробовать себя в новой профессии."}},{"@type":"Question","name":"Какие у меня шансы найти работу после Хекслета?","acceptedAnswer":{"@type":"Answer","text":"Мы подсчитали, 74% ребят, которые приходят в Хекслет, чтобы сменить профессию и трудоустроиться, достигают своей цели. 65% получают оффер на первых пяти собеседованиях. 27% трудоустраиваются без откликов, работодатели находят их сами.\nУспешность дальнейшей карьеры зависит от вас. Но выпускники, которые проходят всю программу, выполняют проекты, работают над коммерческими проектами, имеют все шансы трудоустройства. И мы им в этом помогаем.\nВ школе есть направление «Хекслет. Карьера» — она доступна всем, кто учится в группе или с наставником. В нее входит курс и сообщество. В рамках специального образовательного модуля курса мы учим, как правильно откликаться на объявления, составлять резюме и писать сопроводительные письма в компании, строить карьеру в IT. В сообществе делимся вакансиями от наших партнёров и каждый день работаем над тем, чтобы помочь вам трудоустроиться."}},{"@type":"Question","name":"Если обучение на курсе мне не понравится, могу я вернуть деньги?","acceptedAnswer":{"@type":"Answer","text":"Если вы записались на курс и вдруг поняли, что больше не хотите находиться на онлайн-платформе Хекслет, то мы гарантируем возврат всей суммы. Но только при условии, что со старта обучения прошло не более 14 дней.\nТакже вы можете вернуть деньги за оставшуюся часть программы на любом этапе обучения. И для этого не нужно ничего объяснять."}},{"@type":"Question","name":"Как быть, если я не успею пройти программу за 10 месяцев","acceptedAnswer":{"@type":"Answer","text":"Не переживайте, мы не отчислим вас из Хекслета. Вы всегда можете доучиться. Каждый последующий месяц будет оплачиваться отдельно, за вами сохранится персональный доступ к образовательной площадке и помощь наставника. Как правило, ребятам хватает 1−2 месяцев, чтобы «закрыть хвосты»."}},{"@type":"Question","name":"Что, если я завершу курс раньше?","acceptedAnswer":{"@type":"Answer","text":"Отлично! Доступ к обучению сохранится до конца оплаченного периода. Можете проходить любые программы онлайн-школы или записаться на курс по другой специальности. Это отличная возможность научиться дополнительным навыкам и повысить шансы на получение места в хорошей компании."}},{"@type":"Question","name":"Как оплатить профессию?","acceptedAnswer":{"@type":"Answer","text":"Если вы уверены в своем решении учиться на курсе Фронтенд-разработчика, можете оплатить полную стоимость курса по ссылке сразу после того, как оставите заявку. Мы принимаем карты МИР, а также Visa и MasterCard любого банка, с любой валютой счёта. Также можно самостоятельно оформить банковскую рассрочку и платить частями. Подробнее о банках, с которыми мы работаем, и условиях рассрочки.\nВ течение суток после оплаты кураторы откроют вам онлайн-доступ к сайту и добавят в группу.\nЕсли у вас есть вопросы, сомнения или возникнут трудности с оплатой, дождитесь нашего звонка. Мы проконсультируем и поможем."}},{"@type":"Question","name":"Какие навыки у меня будут после курса Фронтенд-разработчик?","acceptedAnswer":{"@type":"Answer","text":"За 10 месяцев обучения вы научитесь:\nРаботать в HTML, CSS\nРазбираться в JavaScript и TypeScript\nТестировать и править готовый продукт\nРазрабатывать веб-приложения и сайты\nРаботать с бэкендом\nПубликовать веб-приложения и сайты в сети\nПользоваться методами ООП и библиотекой React\nВзаимодействовать с командой посредством Git\nМыслить как опытный frontend-разработчик"}}]}</script></head><body><h1 class='tn-atom'field='tn_text_1743516142502'>Курс «Фронтенд-разработчик»</h1><a class='tn-atom'
