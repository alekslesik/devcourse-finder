# Requires Docker Compose 2.24+ for !reset.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
  migrate:
    environment:
      APP_ENV: production
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
  api:
    ports: !reset []
    environment:
      APP_ENV: production
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      CATALOG_OPERATOR: ${CATALOG_OPERATOR:?Set a stable production operator}
  frontend:
    environment:
      SITE_URL: ${SITE_URL:?Set the public HTTPS origin}
  catalog-updater: &catalog-worker
    image: devcourse-finder-catalog:local
    build:
      context: ./backend
    command: ["catalog-update", "serve"]
    environment: &catalog-worker-env
      CATALOG_WORKER: api
      APP_ENV: production
      GOMEMLIMIT: 96MiB
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-devcourse}
      PGUSER: ${POSTGRES_USER:-devcourse}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      PGSSLMODE: disable
    volumes:
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "devcourse-finder", "catalog-update", "health"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
  catalog-pages:
    <<: *catalog-worker
    environment:
      <<: *catalog-worker-env
      CATALOG_WORKER: pages
  catalog-publisher:
    <<: *catalog-worker
    environment:
      <<: *catalog-worker-env
      CATALOG_WORKER: publisher
