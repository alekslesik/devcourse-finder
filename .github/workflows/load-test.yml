name: Search load test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run 10,000-offer search acceptance measurement
        run: ./scripts/load/run.sh
      - name: Save sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-load-report
          path: |
            .load-results/report.json
            .load-results/base-commit.txt
            .load-results/offer-count.txt
            .load-results/stats.txt
          if-no-files-found: warn
