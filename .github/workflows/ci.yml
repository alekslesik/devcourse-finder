name: CI

on:
  pull_request:
  push:
    branches: [main, work]

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_release.py'
          if [ -n "$BASE_REF" ]; then
            python3 scripts/release.py check --base-ref "origin/$BASE_REF"
          else
            python3 scripts/release.py check
          fi

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devcourse_test
          POSTGRES_USER: devcourse
          POSTGRES_PASSWORD: integration-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devcourse -d devcourse_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://devcourse:integration-test@localhost:5432/devcourse_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./backend/...
      - run: go vet ./backend/...
      - run: python3 -m unittest discover -s scripts/load -p 'test_*.py'
      - run: go run ./backend catalog validate ./data/demo-catalog.json
      - run: go run ./backend catalog validate ./data/real-catalog.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check API compatibility
        working-directory: .
        env:
          API_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 scripts/check-api-compatibility.py "origin/$API_BASE_REF"
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run build:test
      - run: npm run test:routes
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save frontend visual checks and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-checks
          path: frontend/test-results/
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker compose config --quiet
      - name: Validate production stack including the catalog worker
        env:
          POSTGRES_PASSWORD: compose-validation-only
          CATALOG_OPERATOR: compose-validation
          SITE_URL: https://example.com
          WEB_PORT: 127.0.0.1:3000
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Verify rollback removes services absent from an older release
        env:
          RUN_DOCKER_DEPLOY_TESTS: "1"
        run: python3 -m unittest discover -s scripts -p 'test_deploy_orphans.py'
      - name: Run Compose smoke test
        run: ./scripts/compose-smoke.sh

  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser acceptance with production frontend, Go API and PostgreSQL
        run: ./scripts/e2e-real.sh
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-traces
          path: frontend/test-results/
          if-no-files-found: ignore
